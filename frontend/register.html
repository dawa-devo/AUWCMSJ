<body>

    <div class="form-card">
        <div class="header">
            <img src="/frontend/logo.jpg" alt="AUWCMSJ Logo">
            <h2>STUDENT REGISTRATION FORM</h2>
        </div>

        <div class="form-content">
            <form id="registrationForm">
                <div class="form-row">
                    <label>Full Name</label>
                    <input id="fullName" type="text" class="input-field" placeholder="Enter full name" required>
                </div>

                <div class="form-row">
                    <label>University ID</label>
                    <input id="universityId" type="text" class="input-field" placeholder="AU/123/15" required>
                </div>

                <div class="form-row">
                    <label>Department</label>
                    <input id="department" type="text" class="input-field" placeholder="Computer Science">
                </div>

                <div class="form-row">
                    <label>Year of Entry</label>
                    <input id="yearOfEntry" type="text" class="input-field" placeholder="2015">
                </div>

                <div class="form-row">
                    <label for="gender">Gender</label>
                    <select id="gender" class="input-field">
                        <option value="">Select Gender</option>
                        <option value="Male">Male</option>
                        <option value="Female">Female</option>
                    </select>
                </div>

                <div class="form-row">
                    <label>Phone Number</label>
                    <input id="phoneNumber" type="tel" class="input-field" placeholder="09xxxxxxxx" required>
                </div>

                <p class="footer-note">Note: All required fields must be completed.</p>

                <div class="button-group">
                    <button type="button" class="btn btn-back" onclick="window.history.back()">Back</button>
                    <button type="button" id="nextBtn" class="btn btn-next" onclick="validateAndSave()">Next</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        async function validateAndSave() {
            const nextBtn = document.getElementById('nextBtn');

            const data = {
                fullName: document.getElementById('fullName').value.trim(),
                universityId: document.getElementById('universityId').value.trim(),
                department: document.getElementById('department').value.trim(),
                year: document.getElementById('yearOfEntry').value.trim(),
                gender: document.getElementById('gender').value,
                phone: document.getElementById('phoneNumber').value.trim(),
                status: 'pending'
            };

            // --- VALIDATION: Check required fields ---
            if (!data.fullName || !data.universityId || !data.department || !data.year || !data.gender || !data.phone) {
                alert("Error: Full name, university ID, department, year of entry, gender, and phone are required.");
                return;
            }

            nextBtn.disabled = true;
            nextBtn.innerText = "Saving...";
            const controller = new AbortController();
            const timeoutId = setTimeout(() => controller.abort(), 20000);

            try {
                const response = await fetch('/api/register-step1', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data),
                    signal: controller.signal
                });

                const result = await response.json().catch((err) => {
                    if (err.name === 'AbortError') throw err;
                    return {};
                });
                if (!response.ok) {
                    const errorMessage = result.message || `Registration failed (HTTP ${response.status}).`;
                    throw new Error(errorMessage);
                }

                localStorage.setItem('tempStudentId', data.universityId);
                localStorage.setItem('fullName', data.fullName);
                if (result.registrationToken) {
                    sessionStorage.setItem('registrationToken', result.registrationToken);
                }
                window.location.href = 'fcontact.html';
            } catch (err) {
                console.error(err);
                alert(err.name === 'AbortError' || err instanceof TypeError
                    ? "Network error, please try again."
                    : err.message || "Network error, please try again.");
            } finally {
                nextBtn.disabled = false;
                nextBtn.innerText = "Next";
                clearTimeout(timeoutId);
            }
        }
    </script>
