<body>

    <div class="login-card">
        <div class="top-logo-container">
            <img src="/frontend/logo.jpg" alt="AUWCMSJ Logo">
            <h1>AUWCMSJ</h1>
        </div>
        <div class="title-section">
            <p>Jema'a Portal Login</p>
        </div>

        <div id="notice-box" class="notice-box"></div>

        <form onsubmit="handleLogin(event)">
            <div class="input-group">
                <i class="fa-solid fa-user main-icon"></i>
                <input type="text" id="userId" placeholder="ID Number (AU/123/15)" required>
            </div>
            <div class="input-group">
                <i class="fa-solid fa-lock main-icon"></i>
                <input type="password" id="passwordField" placeholder="Password" required>
                <i class="fa-solid fa-eye password-toggle" id="toggleIcon" onclick="togglePassword()"></i>
            </div>
            <button type="submit" id="loginBtn" class="login-btn">Login</button>
        </form>
        <p class="signup-text">Don't have an account? <a href="register.html">Sign Up (Register Now)</a></p>
    </div>

    <script>
        const loginNetworkError = "Your connection is slow or unavailable. Check your internet and try again. / Intarneetiin suuta jira ykn hin hojjetu. Maaloo ilaalaa irra deebi'aa yaalaa.";
        let loginRequestInProgress = false;

        // Password agarsiisuu fi dhoksuuf
        function togglePassword() {
            const pwField = document.getElementById('passwordField');
            const icon = document.getElementById('toggleIcon');
            if (pwField.type === 'password') {
                pwField.type = 'text';
                icon.classList.replace('fa-eye', 'fa-eye-slash');
            } else {
                pwField.type = 'password';
                icon.classList.replace('fa-eye-slash', 'fa-eye');
            }
        }

        const loginReason = new URLSearchParams(window.location.search).get('reason');
        if (loginReason) {
            const noticeBox = document.getElementById('notice-box');
            noticeBox.style.display = "block";
            noticeBox.innerText = loginReason;
        }

        // Hojii Login raawwachuuf
        async function handleLogin(event) {
            event.preventDefault(); // Fuulli akka hin 'refresh' goone
            if (loginRequestInProgress) return;

            const noticeBox = document.getElementById('notice-box');
            const loginBtn = document.getElementById('loginBtn');

            // Ragaalee input irraa fuuchuu (IDs sirreeffamaniiru)
            const identifier = document.getElementById('userId').value.trim();
            const password = document.getElementById('passwordField').value.trim();

            loginRequestInProgress = true;
            loginBtn.innerText = "Signing in...";
            loginBtn.disabled = true;

            let requestTimeoutId = null;
            try {
                const apiBases = [''];
                let res = null;
                let lastFetchErr = null;
                for (const base of apiBases) {
                    const controller = new AbortController();
                    requestTimeoutId = setTimeout(() => controller.abort(), 20000);
                    try {
                        res = await fetch(`${base}/api/login`, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ studentId: identifier, password }),
                            signal: controller.signal
                        });
                        break;
                    } catch (e) {
                        lastFetchErr = e;
                        clearTimeout(requestTimeoutId);
                    }
                }
                if (!res) throw lastFetchErr || new Error('Cannot reach API');

                const data = await res.json().catch((error) => {
                    if (error.name === 'AbortError') throw error;
                    return {};
                });
                clearTimeout(requestTimeoutId);

                if (res.ok) {
                    const role = String(data?.role || '').toLowerCase();
                    // Success response irrattis data barbaachisaa jiraachuu mirkaneessi
                    const hasRequiredSessionData =
                        typeof data?.name === 'string' &&
                        data.name.trim() !== '' &&
                        (role === 'admin' || role === 'student' || role === 'teacher') &&
                        typeof data?.token === 'string' &&
                        data.token.trim() !== '';

                    if (!hasRequiredSessionData) {
                        noticeBox.style.display = "block";
                        noticeBox.innerText = "Server response guutuu miti. Maaloo irra deebi'ii yaali.";
                        return;
                    }

                    // Ragaalee kuusuu
                    sessionStorage.setItem('isLoggedIn', 'true');
                    sessionStorage.setItem('userName', data.name);
                    sessionStorage.setItem('role', role);
                    sessionStorage.setItem('token', data.token);
                    sessionStorage.setItem('studentId', data.studentId || '');
                    localStorage.setItem('currentUser', data.name);
                    localStorage.removeItem('currentProfilePic');

                    // Gara Dashboard-itti dabarsuu
                    if (role === 'admin') {
                        window.location.href = '../admin/admin.html';
                    } else {
                        window.location.href = 'userdashboard.html';
                    }
                } else {
                    // Backend 'message' deebisa yoo ta'e data.message fayyadami
                    noticeBox.style.display = "block";
                    noticeBox.innerText = data.message || data.error || "Login hin milkoofne!";
                }
            } catch (error) {
                console.error("Error:", error);
                noticeBox.style.display = "block";
                noticeBox.innerText = error.name === 'AbortError' || error instanceof TypeError
                    ? loginNetworkError
                    : error.message || loginNetworkError;
            } finally {
                clearTimeout(requestTimeoutId);
                loginRequestInProgress = false;
                loginBtn.innerText = "Login";
                loginBtn.disabled = false;
            }
        }
    </script>
</body>
