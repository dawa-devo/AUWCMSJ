    <style>

            border-radius: 8px;
            margin-bottom: 25px;

        .input-group {

        .input-group label {
            display: block;

        .text-area {

<body>

    <div class="form-card">
        <div class="step-tabs">
            <h2>Skills & Contribution</h2>
        </div>

        <form id="skillsForm">
            <div class="input-group">
                <label>Academic Skills</label>
                <textarea id="academicSkill" class="text-area"
                    placeholder="e.g., 'I am good at Python programming...'"></textarea>
            </div>

            <div class="input-group">
                <label>Spiritual Skills</label>
                <textarea id="spiritualSkill" class="text-area"
                    placeholder="e.g., 'I can lead prayers or teach Quran.'"></textarea>
            </div>

            <div class="input-group">
                <label>Contribution</label>
                <textarea id="contribution" class="text-area"
                    placeholder="How do you want to help the community?"></textarea>
            </div>

            <div class="button-group">
                <button type="button" class="btn btn-back" onclick="window.location.href='fcontact.html'">Back</button>
                <button type="button" class="btn btn-next" onclick="saveSkillsAndContinue()">Next</button>
            </div>
        </form>
    </div>

    <script>
        sessionStorage.setItem('currentStep', 'skills');

        async function saveSkillsAndContinue() {
            const data = {
                universityId: localStorage.getItem('tempStudentId'),
                registrationToken: sessionStorage.getItem('registrationToken') || '',
                academicSkill: document.getElementById('academicSkill').value.trim(),
                spiritualSkill: document.getElementById('spiritualSkill').value.trim(),
                contribution: document.getElementById('contribution').value.trim()
            };

            const nextBtn = document.querySelector('.btn-next');
            const controller = new AbortController();
            const timeoutId = setTimeout(() => controller.abort(), 20000);
            try {
                if (nextBtn) {
                    nextBtn.disabled = true;
                    nextBtn.innerText = 'Saving...';
                }
                const response = await fetch('/api/skills', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data),
                    signal: controller.signal
                });
                const result = await response.json().catch((err) => {
                    if (err.name === 'AbortError') throw err;
                    return {};
                });
                if (!response.ok) {
                    throw new Error(result.message || `Skills could not be saved (HTTP ${response.status}).`);
                }
                const generatedPassword = sessionStorage.getItem('pendingRegistrationPassword');
                if (generatedPassword) {
                    alert(`Registration complete. Your generated password is ${generatedPassword}. Save it to log in after admin approval.`);
                    sessionStorage.removeItem('pendingRegistrationPassword');
                }
                sessionStorage.setItem('currentStep', 'complete');
                window.location.href = 'verification.html';
            } catch (err) {
                console.error('Server error:', err);
                alert(err.name === 'AbortError' || err instanceof TypeError
                    ? 'Network error, please try again.'
                    : err.message || 'Network error, please try again.');
                if (nextBtn) {
                    nextBtn.disabled = false;
                    nextBtn.innerText = 'Next';
                }
            } finally {
                clearTimeout(timeoutId);
                if (nextBtn) {
                    nextBtn.disabled = false;
                    nextBtn.innerText = 'Next';
                }
            }
        }
    </script>
</body>
